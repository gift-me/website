{% extends "auth_base.html" %}
{% block title %}Password updated | GiftMe{% endblock %}
{% block content %}
<section class="auth-card">
    <div class="auth-topbar">
        <a href="{% url 'account_login' %}" class="auth-back-inline" aria-label="Back to login">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="auth-brand"><i class="fa-solid fa-gift"></i> GiftMe</div>
        <span class="auth-topbar-spacer"></span>
    </div>

    <div class="auth-status-icon is-success" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></div>
    <h1>Password updated</h1>
    <p class="auth-lede">Your password has been changed. You can sign in with your new credentials.</p>
    <a href="{% url 'account_login' %}" class="auth-submit btn-with-icon" style="text-decoration:none;margin-top:1rem;">
        <span class="btn-label">Go to login</span>
        <svg aria-hidden="true"><use href="#icon-arrow-right"/></svg>
    </a>
</section>
{% endblock %}
