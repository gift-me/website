{% comment %}
  Living Ink CTA — reusable button surface.

  Variables:
    href      — link URL (renders <a>; omit for <button>)
    label     — button text
    variant   — primary (default) | secondary
    type      — button type when not a link (default: button)
    class     — extra utility classes (sizes: ink-btn--sm, ink-btn--block)
    disabled  — true for disabled state
    icon      — none to hide arrow on primary
{% endcomment %}
{% if href %}
<a href="{{ href }}" class="ink-btn ink-btn--{{ variant|default:'primary' }}{% if class %} {{ class }}{% endif %}{% if disabled %} is-disabled{% endif %}"{% if disabled %} aria-disabled="true" tabindex="-1"{% endif %}>
{% else %}
<button type="{{ type|default:'button' }}" class="ink-btn ink-btn--{{ variant|default:'primary' }}{% if class %} {{ class }}{% endif %}"{% if disabled %} disabled{% endif %}>
{% endif %}
    <span class="ink-btn__label">{{ label }}</span>
    {% if variant != "secondary" and icon != "none" %}
    <svg class="ink-btn__icon cta-primary-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <use href="#icon-cta-arrow"/>
    </svg>
    {% endif %}
{% if href %}
</a>
{% else %}
</button>
{% endif %}
